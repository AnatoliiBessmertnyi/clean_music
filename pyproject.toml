[project]
name = "audio-cleaner"
version = "1.0.0"
description = "Скрипт для очистки и переименования аудиофайлов"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
# Автоисправление включается явно для согласованного списка файлов.
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "Q", "N", "SIM", "RET", "T20"]
# Форматтер не разбивает все строки, особенно сообщения CLI и регулярные выражения.
# Экранированием кавычек также управляет форматтер.
ignore = ["E501", "Q003", "Q004"]
# Даже при явном запросе unsafe-fixes нельзя автоматически удалять вывод CLI.
unfixable = ["T20"]

[tool.ruff.lint.per-file-ignores]
# В этих модулях print является частью существующего консольного интерфейса.
"main.py" = ["T201"]
"interactor.py" = ["T201"]
"context.py" = ["T201"]
"tag_repository.py" = ["T201"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
